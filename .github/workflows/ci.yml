name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Compilar firmware (Arduino Mega 2560)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:mega:cpu=atmega2560
          sketch-paths: |
            - labs/lab01-sonar-basico/firmware/lab01_sonar

  python:
    name: Lint e teste dos scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff -r tools/requirements.txt
      - run: ruff check tools/
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Teste da análise com dados de exemplo
        env:
          MPLBACKEND: Agg
        run: python tools/analisar.py --csv tools/exemplo/medicoes_exemplo.csv
